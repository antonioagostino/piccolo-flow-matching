training:
  data_dir: ./data/
  backbone: unet
  backbone_config: ./configs/unet.yaml
  embedding_dim: 384
  sigma_min: 0.0
  data_on_device: true
  batch_size: 256
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-3
  lr_warmup_iterations: 1000
  max_iterations: 73450
  weight_decay: 0.0
  max_grad_norm: 1.0
  ema_decay: 0.9999
  device: cuda
  compile_model: true
  seed: 42
  log_every_iterations: 100
  val_every_iterations: 7345
  val_max_iterations: 40
  snapshot_every_iterations: 73450
  n_epochs: 100000
  checkpoint_dir: ./checkpoints/sweep_unet_lr1e-3
  resume_from: null
  wandb:
    enabled: true
    project: piccolo-flow-matching
    run_name: sweep_unet_lr1e-3
    mode: online
    resume_id: null
