training:
  data_dir: ./data/
  backbone: unet
  backbone_config: ./configs/unet.yaml
  embedding_dim: 384
  sigma_min: 0.0
  data_on_device: false
  batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-4
  lr_warmup_iterations: 50
  max_iterations: 300
  weight_decay: 0.0
  max_grad_norm: 1.0
  ema_decay: 0.9999
  device: cuda
  compile_model: true
  seed: 42
  log_every_iterations: 10
  val_every_iterations: 100
  val_max_iterations: 5
  snapshot_every_iterations: 100
  n_epochs: 100000
  checkpoint_dir: ./checkpoints/smoke_unet
  resume_from: null
  wandb:
    enabled: false
    project: piccolo-flow-matching
    run_name: smoke_unet
    mode: online
    resume_id: null
