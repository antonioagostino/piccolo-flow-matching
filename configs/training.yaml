training:
  data_dir: ./data/
  backbone: dit
  backbone_config: ./configs/dit.yaml
  embedding_dim: 384
  sigma_min: 0.0
  ema_decay: 0.9999
  batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-4
  lr_warmup_iterations: 1000
  max_iterations: 10000
  weight_decay: 0.0
  max_grad_norm: 1.0
  device: cuda
  compile_model: true
  seed: 42
  log_every_iterations: 100
  val_every_iterations: 1000
  val_max_iterations: 40
  snapshot_every_iterations: null
  data_on_device: false
  n_epochs: 100000
  checkpoint_dir: ./checkpoints/sweep_dit_lr3e-4
  wandb:
    enabled: true
    project: piccolo-flow-matching
    run_name: sweep-dit-lr3e-4
    mode: online